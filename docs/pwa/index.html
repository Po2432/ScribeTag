<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ScribeGrid Mobile</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="container" style="box-shadow: none; padding: 10px;">
        <h2>ScribeGrid</h2>
        
        <div id="pwa-input-area">
            <select id="pwa-type" onchange="toggleForm('pwa')">
                <option value="text">Text</option>
                <option value="url">Link</option>
                <option value="wifi">WiFi</option>
            </select>

            <div id="pwa-text-group" class="pwa-group">
                <textarea id="pwa-text" rows="3" placeholder="Type here..."></textarea>
            </div>

            <div id="pwa-url-group" class="pwa-group" style="display:none;">
                <input type="url" id="pwa-url" placeholder="example.com">
            </div>

            <div id="pwa-wifi-group" class="pwa-group" style="display:none;">
                <input type="text" id="pwa-ssid" placeholder="Network Name">
                <input type="text" id="pwa-pass" placeholder="Password">
            </div>

            <button class="btn" style="width:100%" onclick="generateScribeTag('pwa')">Draw Step-by-Step</button>
        </div>

        <div id="wizard-container">
            <div id="minimap"></div>
            <canvas id="step-canvas"></canvas>
            <div id="instruction-text" class="instruction-text"></div>
            <div class="nav-buttons">
                <button id="btn-prev" class="btn btn-secondary btn-nav" onclick="prevStep()"><</button>
                <button id="btn-next" class="btn btn-nav" onclick="nextStep()">Next ></button>
            </div>
        </div>
    </div>
    
    <script src="../app.js"></script>
    <script>
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
    </script>
</body>
</html>
