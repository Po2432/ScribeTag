<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScribeTag Scanner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Scan ScribeTag</h1>
        <p id="status">Loading Vision Engine (OpenCV)... Please wait.</p>
        
        <div id="camera-container">
            <video id="videoElement" autoplay playsinline></video>
            <div class="scan-overlay"></div>
            <!-- Hidden canvas used for OpenCV processing -->
            <canvas id="canvasOutput" style="display:none;"></canvas> 
        </div>

        <div id="scan-result"></div>

        <a href="index.html" class="btn btn-secondary">Back to Home</a>
    </div>

    <!-- Load OpenCV.js asynchronously -->
    <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady();"></script>
    <script src="scanner.js"></script>
</body>
</html>
